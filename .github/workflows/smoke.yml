name: Smoke test

# Runs on every PR + every push to main. The job builds the frontend, boots
# the server with NODE_ENV=production, and verifies that critical endpoints
# answer correctly. If anything fails, the PR is blocked from merging — so a
# broken build can never reach Render.
#
# What this catches that `npm run build` alone misses:
#   • runtime import / dead-code-path errors
#   • route handlers that crash on first request
#   • static-serving regressions ("/" returns text/html, /assets/*.js exists)
#   • dist/index.html missing or empty
#   • new envs that explode at startup

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  smoke:
    name: Build + boot + probe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=dev --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify dist/ output exists and is non-trivial
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -d dist/assets     || { echo "::error::dist/assets missing"; exit 1; }
          # Index must contain at least one /assets/*.js reference — proves bundle was emitted.
          grep -q '/assets/.*\.js' dist/index.html || { echo "::error::dist/index.html has no JS bundle reference"; exit 1; }
          echo "✓ dist/index.html ($(wc -c < dist/index.html) bytes) + $(ls dist/assets | wc -l) assets"

      - name: Run smoke test (boots server in dev mode, probes endpoints)
        env:
          # NODE_ENV deliberately UNSET — smoke-test.mjs boots server.js as a
          # child process and `enforceHttps` 301-redirects HTTP→HTTPS in prod,
          # which we can't curl without a cert. Dev mode exercises the same
          # imports + handlers and proves the build is healthy.
          STRIPE_SECRET_KEY: sk_test_dummy_for_smoke
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy_for_smoke
          JWT_SECRET: smoke-test-secret-must-be-long-enough-to-pass-validation
          URL_SIGN_SECRET: smoke-test-url-sign-secret-also-long-enough
          SESSION_SECRET: smoke-test-session-secret-also-long-enough
        run: npm run smoke

      - name: Verify static asset serving (production mode)
        env:
          # Production mode so dist/ static + SPA fallback is registered. We
          # send X-Forwarded-Proto: https on every probe so enforceHttps
          # doesn't 301 us — mimicking how Cloudflare/Render's edge sets it.
          NODE_ENV: production
          STRIPE_SECRET_KEY: sk_test_dummy_for_smoke
          STRIPE_PUBLISHABLE_KEY: pk_test_dummy_for_smoke
          JWT_SECRET: smoke-test-secret-must-be-long-enough-to-pass-validation
          URL_SIGN_SECRET: smoke-test-url-sign-secret-also-long-enough
          SESSION_SECRET: smoke-test-session-secret-also-long-enough
          PORT: 3100
        run: |
          set -eo pipefail
          # Boot server in background, redirect output to file we can dump on failure.
          node server.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            local code=$?
            if [ $code -ne 0 ]; then
              echo "::group::Server log (last 200 lines)"
              tail -200 /tmp/server.log 2>/dev/null || echo "(no log)"
              echo "::endgroup::"
            fi
            kill -9 $SERVER_PID 2>/dev/null || true
            return $code
          }
          trap cleanup EXIT

          # Wait up to 60s for /api/health to answer 200. We probe /api/health
          # specifically (rather than just opening the port) because in
          # production mode helmet/enforceHttps will redirect / before listen
          # is fully ready, while /api/health is unconditional once the
          # express handler is mounted. X-Forwarded-Proto bypasses enforceHttps.
          echo "Waiting for server to accept requests on :3100…"
          READY=0
          for i in $(seq 1 60); do
            CODE=$(curl --max-time 2 -s -o /dev/null -w "%{http_code}" \
                   -H "X-Forwarded-Proto: https" \
                   "http://127.0.0.1:3100/api/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ] || [ "$CODE" = "503" ]; then
              echo "Server responded with HTTP $CODE after ${i}s"
              READY=1
              break
            fi
            # On every 10s, dump tail of log so we can see progress
            if [ $((i % 10)) -eq 0 ]; then
              echo "  …still waiting (${i}s). Last server log line:"
              tail -1 /tmp/server.log 2>/dev/null | sed 's/^/    /'
            fi
            sleep 1
          done

          if [ "$READY" != "1" ]; then
            echo "::error::Server never became ready within 60s"
            exit 1
          fi

          probe_header() {
            curl --max-time 5 -s -I -H "X-Forwarded-Proto: https" "$1" \
              | tr -d '\r' \
              | grep -i "^$2:" \
              | head -1 \
              | sed -E "s/^[Cc]ontent-[Tt]ype: *//I"
          }

          probe_status() {
            curl --max-time 5 -s -o /dev/null -w "%{http_code}" \
              -H "X-Forwarded-Proto: https" "$1"
          }

          # 1) Root must return text/html (not application/octet-stream → would cause browser download)
          ROOT_CT=$(probe_header "http://127.0.0.1:3100/" "Content-Type")
          echo "Root Content-Type: '$ROOT_CT'"
          if ! echo "$ROOT_CT" | grep -qi "text/html"; then
            echo "::error::/ returned wrong Content-Type ($ROOT_CT) — would trigger browser download"
            exit 1
          fi

          # 2) Bundle reference exists in index.html and returns application/javascript
          BUNDLE=$(curl --max-time 5 -s -H "X-Forwarded-Proto: https" http://127.0.0.1:3100/ \
                   | grep -oE '/assets/[^"]+\.js' | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::No /assets/*.js reference found in index.html"
            exit 1
          fi
          JS_CT=$(probe_header "http://127.0.0.1:3100$BUNDLE" "Content-Type")
          echo "Bundle ($BUNDLE) Content-Type: '$JS_CT'"
          if ! echo "$JS_CT" | grep -qi "javascript"; then
            echo "::error::JS bundle returned wrong Content-Type ($JS_CT) — browser will refuse to execute under nosniff"
            exit 1
          fi

          # 3) Missing bundle returns 404 (the stale-cache regression guard)
          FAKE_STATUS=$(probe_status "http://127.0.0.1:3100/assets/this-bundle-does-not-exist.js")
          echo "Missing-asset status: $FAKE_STATUS"
          if [ "$FAKE_STATUS" != "404" ]; then
            echo "::error::/assets/missing.js returned $FAKE_STATUS instead of 404 — stale-cache regression"
            exit 1
          fi

          # 4) /api/health returns 200
          HEALTH=$(probe_status "http://127.0.0.1:3100/api/health")
          echo "Health status: $HEALTH"
          if [ "$HEALTH" != "200" ]; then
            echo "::error::/api/health returned $HEALTH"
            exit 1
          fi

          echo ""
          echo "✓ Static serving + asset MIME + 404 fallthrough + health all OK"
