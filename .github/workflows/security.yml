name: Security scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly scan every Monday 03:00 UTC — catches new CVEs even without code changes
    - cron: '0 3 * * 1'

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run audit (fail on high/critical)
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan code for weak default secrets
        run: |
          # Match the legacy placeholder strings that used to ship as
          # fallback secrets. The grep deliberately ignores the lines that
          # DEFINE the blocklist itself (server.js: _WEAK_SUBSTRINGS,
          # FORBIDDEN_SECRETS) — those are the guard, not a leak.
          HITS=$(grep -rn "bundly-super-secret-2024\|admin123\|change-me-to-a" \
                   --include="*.js" --include="*.jsx" \
                   --exclude-dir=node_modules . \
                 | grep -v "_WEAK_SUBSTRINGS\|FORBIDDEN_SECRETS" \
                 || true)
          if [ -n "$HITS" ]; then
            echo "::error::Default secrets found in code!"
            echo "$HITS"
            exit 1
          fi

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
