<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>BundlyRoadLoader Preview</title>
<style>
  body { background:#f8fafc; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:Rubik,system-ui,sans-serif; }
  h2 { color:#374151; margin-bottom:16px; }
</style>
</head>
<body>
<h2>BundlyRoadLoader — תצוגה מקדימה</h2>

<div style="position:relative;width:480px;height:280px;">
<svg width="480" height="280" viewBox="0 0 480 280" style="display:block;">
  <defs>
    <linearGradient id="bVanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Circuit interior fill -->
  <path id="brl-circuit" d="M 88,265 L 370,265 C 438,265 462,232 462,188 C 462,138 440,102 404,86 C 380,74 348,70 318,80 C 294,88 278,112 255,118 C 232,124 208,108 184,84 L 108,28 C 66,14 18,48 14,100 C 10,154 38,200 74,228 C 82,248 87,258 88,265 Z" fill="#f0fdf4" opacity="0.4"/>

  <!-- Interior greenery -->
  <text x="195" y="148" font-size="20" opacity="0.28">🌳</text>
  <text x="240" y="120" font-size="13" opacity="0.22">🌿</text>
  <text x="168" y="175" font-size="11" opacity="0.18">🌱</text>
  <text x="260" y="165" font-size="10" opacity="0.18">🌿</text>
  <text x="210" y="95"  font-size="9"  opacity="0.15">🌱</text>

  <!-- Road: outer kerb strip -->
  <path d="M 88,265 L 370,265 C 438,265 462,232 462,188 C 462,138 440,102 404,86 C 380,74 348,70 318,80 C 294,88 278,112 255,118 C 232,124 208,108 184,84 L 108,28 C 66,14 18,48 14,100 C 10,154 38,200 74,228 C 82,248 87,258 88,265 Z" fill="none" stroke="#b0bec5" stroke-width="28" stroke-linejoin="round"/>
  <!-- Red/white kerb dashes at corners -->
  <path d="M 88,265 L 370,265 C 438,265 462,232 462,188 C 462,138 440,102 404,86 C 380,74 348,70 318,80 C 294,88 278,112 255,118 C 232,124 208,108 184,84 L 108,28 C 66,14 18,48 14,100 C 10,154 38,200 74,228 C 82,248 87,258 88,265 Z" fill="none" stroke="#ef4444" stroke-width="28" stroke-linejoin="round" stroke-dasharray="7 55" opacity="0.22"/>
  <!-- Road asphalt surface -->
  <path d="M 88,265 L 370,265 C 438,265 462,232 462,188 C 462,138 440,102 404,86 C 380,74 348,70 318,80 C 294,88 278,112 255,118 C 232,124 208,108 184,84 L 108,28 C 66,14 18,48 14,100 C 10,154 38,200 74,228 C 82,248 87,258 88,265 Z" fill="none" stroke="#dde2e8" stroke-width="23" stroke-linejoin="round"/>
  <!-- Centre dashes -->
  <path d="M 88,265 L 370,265 C 438,265 462,232 462,188 C 462,138 440,102 404,86 C 380,74 348,70 318,80 C 294,88 278,112 255,118 C 232,124 208,108 184,84 L 108,28 C 66,14 18,48 14,100 C 10,154 38,200 74,228 C 82,248 87,258 88,265 Z" fill="none" stroke="#fcd34d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="11 11"/>

  <!-- Start/finish chequered strip -->
  <rect x="107" y="256" width="28" height="6" rx="1.5" fill="#1e1b4b" opacity="0.12"/>
  <rect x="111" y="256" width="5"  height="6" fill="white" opacity="0.6"/>
  <rect x="121" y="256" width="5"  height="6" fill="white" opacity="0.6"/>
  <rect x="131" y="256" width="5"  height="6" fill="white" opacity="0.6"/>

  <!-- DELIVERY VAN -->
  <g>
    <!-- Ground shadow -->
    <ellipse cx="0" cy="8" rx="36" ry="5" fill="#000" opacity="0.09"/>
    <!-- Cargo box -->
    <rect x="-40" y="-24" width="50" height="24" rx="3" fill="url(#bVanGrad)"/>
    <!-- Cargo top highlight -->
    <rect x="-40" y="-24" width="50" height="5" rx="3" fill="#6d28d9" opacity="0.55"/>
    <!-- Rear door seam -->
    <line x1="-40" y1="-12" x2="10" y2="-12" stroke="#6d28d9" stroke-width="1" opacity="0.5"/>
    <!-- BIG B on cargo -->
    <text x="-16" y="-6" text-anchor="middle" dominant-baseline="middle" font-size="22" fill="white" font-weight="900" font-family="Rubik,system-ui,sans-serif">B</text>
    <!-- Cab -->
    <rect x="10" y="-21" width="26" height="21" rx="5" fill="#6d28d9"/>
    <!-- Cab roof rack -->
    <rect x="10" y="-26" width="26" height="7"  rx="3" fill="#5b21b6"/>
    <!-- Windshield -->
    <rect x="13" y="-19" width="18" height="13" rx="2.5" fill="#bae6fd" opacity="0.88"/>
    <!-- Windshield glare -->
    <rect x="14" y="-18" width="6"  height="4"  rx="1"   fill="white" opacity="0.35"/>
    <!-- Headlight -->
    <rect x="34" y="-13" width="2.5" height="6" rx="1" fill="#fef9c3"/>
    <!-- Side mirror -->
    <rect x="35" y="-20" width="4" height="3" rx="1" fill="#5b21b6"/>
    <!-- Rear tandem wheels -->
    <circle cx="-26" cy="5" r="8"   fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="-26" cy="5" r="3.5" fill="#818cf8"/>
    <circle cx="-13" cy="5" r="8"   fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="-13" cy="5" r="3.5" fill="#818cf8"/>
    <!-- Front wheel -->
    <circle cx="24"  cy="5" r="7"   fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="24"  cy="5" r="3"   fill="#818cf8"/>
    <animateMotion
      dur="12s"
      repeatCount="indefinite"
      rotate="auto"
      keyPoints="0;0.13;0.13;0.26;0.26;0.40;0.40;0.55;0.55;0.69;0.69;0.83;0.83;1"
      keyTimes="0;0.10;0.16;0.24;0.30;0.38;0.44;0.53;0.59;0.67;0.73;0.82;0.88;1"
      calcMode="linear">
      <mpath href="#brl-circuit"/>
    </animateMotion>
  </g>

  <!-- STORE 1 (bottom straight ~13%) -->
  <g transform="translate(248,279)">
    <rect x="-11" y="-12" width="22" height="10" rx="1.5" fill="#fef3c7"/>
    <rect x="-11" y="-16" width="22" height="6"  rx="1.5" fill="#16a34a"/>
    <rect x="-8"  y="-9"  width="4"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="-2"  y="-6"  width="4"  height="6"  rx="0.5" fill="#fde68a"/>
    <rect x="4"   y="-9"  width="4"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
  </g>

  <!-- STORE 2 (right hairpin ~26%) -->
  <g transform="translate(470,188)">
    <rect x="-12" y="-14" width="22" height="12" rx="1.5" fill="#fee2e2"/>
    <rect x="-12" y="-19" width="22" height="7"  rx="1.5" fill="#dc2626"/>
    <rect x="-9"  y="-11" width="4"  height="6"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="-3"  y="-8"  width="5"  height="7"  rx="0.5" fill="#fde68a"/>
    <rect x="4"   y="-11" width="4"  height="6"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
  </g>

  <!-- STORE 3 (top-right ~40%) -->
  <g transform="translate(435,62)">
    <rect x="-13" y="-14" width="26" height="12" rx="1.5" fill="#94a3b8"/>
    <rect x="-13" y="-19" width="26" height="7"  rx="1.5" fill="#475569"/>
    <rect x="-10" y="-8"  width="8"  height="5"  rx="0.5" fill="#e2e8f0"/>
    <rect x="2"   y="-10" width="7"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.85"/>
  </g>

  <!-- STORE 4 (top centre ~55%) -->
  <g transform="translate(228,10)">
    <rect x="-13" y="-2" width="26" height="11" rx="1.5" fill="#eff6ff"/>
    <rect x="-13" y="-7" width="26" height="7"  rx="1.5" fill="#3b82f6"/>
    <rect x="-10" y="1"  width="5"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="-3"  y="3"  width="4"  height="7"  rx="0.5" fill="#dbeafe"/>
    <rect x="4"   y="1"  width="5"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
  </g>

  <!-- STORE 5 (top-left ~69%) -->
  <g transform="translate(80,10)">
    <rect x="-2"  y="-2" width="22" height="11" rx="1.5" fill="#ede9fe"/>
    <rect x="-2"  y="-7" width="22" height="7"  rx="1.5" fill="#7c3aed"/>
    <rect x="0"   y="1"  width="4"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
    <rect x="7"   y="3"  width="4"  height="7"  rx="0.5" fill="#ddd6fe"/>
    <rect x="13"  y="1"  width="4"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
  </g>

  <!-- STORE 6 (left side ~83%) -->
  <g transform="translate(6,152)">
    <rect x="-2"  y="-13" width="26" height="11" rx="1.5" fill="#f0fdf4"/>
    <rect x="-2"  y="-18" width="26" height="7"  rx="1.5" fill="#15803d"/>
    <rect x="0"   y="-8"  width="7"  height="5"  rx="0.5" fill="#e2e8f0"/>
    <rect x="9"   y="-10" width="5"  height="5"  rx="0.5" fill="#bfdbfe" opacity="0.8"/>
  </g>
</svg>
</div>

<p style="color:#6b7280;margin-top:12px;font-size:14px;">הרכב המסחרי נוסע 12 שניות למחזור — כולל פנייה אוטומטית עם הדרך</p>
</body>
</html>
