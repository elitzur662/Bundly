<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="120" cy="120" r="180" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="1080" cy="510" r="220" fill="#ffffff" fill-opacity="0.08"/>

  <!-- Center card -->
  <rect x="100" y="120" width="1000" height="390" rx="36" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- "B" logo badge — drawn as SVG paths, no font/emoji dependency -->
  <g transform="translate(540 195)">
    <!-- amber circle behind the B -->
    <circle cx="60" cy="60" r="68" fill="url(#badge)"/>
    <!-- "B" letter rendered as path so it ignores host fonts -->
    <path d="M 32 22 L 32 98 L 70 98 Q 92 98 92 80 Q 92 68 80 62 Q 90 56 90 44 Q 90 22 70 22 Z M 48 36 L 70 36 Q 76 36 76 44 Q 76 52 70 52 L 48 52 Z M 48 66 L 72 66 Q 80 66 80 76 Q 80 84 72 84 L 48 84 Z"
          fill="#ffffff"/>
  </g>

  <!-- "BUNDLY" wordmark — generic sans-serif renders everywhere -->
  <text x="600" y="385" font-family="sans-serif" font-size="92" font-weight="900"
        fill="#ffffff" text-anchor="middle" letter-spacing="6">
    BUNDLY
  </text>

  <!-- Latin tagline — safe on every rasteriser -->
  <text x="600" y="445" font-family="sans-serif" font-size="32" font-weight="500"
        fill="#ffffff" fill-opacity="0.92" text-anchor="middle" letter-spacing="1">
    Group Buying in Israel · Real Group Prices
  </text>

  <!-- URL stripe at bottom -->
  <rect x="0" y="570" width="1200" height="60" fill="#1f2937"/>
  <text x="600" y="608" font-family="sans-serif" font-size="28" font-weight="700"
        fill="#c084fc" text-anchor="middle" letter-spacing="2">
    bundly.co
  </text>
</svg>
