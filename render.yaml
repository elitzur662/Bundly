# Render.com Blueprint — one-click deploy for Bundly.
# Apply via: render.com → New → Blueprint → connect GitHub repo.
#
# What this does:
#   1. Provisions a single Web Service running `npm run start:prod`.
#   2. Mounts a persistent disk at /var/data so JSON DB + SQLite cache
#      survive deploys (without this, every deploy resets user data).
#   3. Wires the disk path through DATA_DIR / DB_PATH env vars.
#   4. Leaves all secret env vars (Stripe, OpenAI, JWT, etc.) for you
#      to set in the Render dashboard — they MUST NOT live in git.
services:
  - type: web
    name: bundly
    runtime: node
    # standard — $25/mo, 2GB RAM. starter (512MB) consistently OOM'd: the
    # in-memory product catalog (17K models) + ZAP caches + suggest index +
    # 62K-street autocomplete pushed V8 past the container limit and the
    # kernel SIGKILL'd the process. 2GB gives ~8x headroom for organic growth.
    plan: standard
    # NOTE: the LIVE service does not run here. Its DNS resolves to
    # gcp-us-west1-1.origin.onrender.com, i.e. Oregon, which adds a round trip
    # of roughly 150-200ms for Israeli users on every uncached request. This
    # line applies to a service created FROM this blueprint; the existing one
    # was created another way and a region cannot be changed in place — moving
    # it means creating a new service and migrating the persistent disk.
    region: frankfurt        # closest Render region to Israel; lowest latency.
    branch: main
    autoDeploy: true
    # `npm ci --include=dev` is ~2x faster than `npm install --legacy-peer-deps`:
    # it uses package-lock.json deterministically without resolving peers, skips
    # the slow tree-walking, and leverages Render's npm cache more efficiently.
    # `--include=dev` is required because vite/tailwind are devDependencies and
    # NODE_ENV=production env var would otherwise skip them.
    buildCommand: npm ci --legacy-peer-deps --include=dev --no-audit --no-fund && npm run build
    # NODE_ENV=production triggers server.js to serve dist/ as static + SPA fallback.
    startCommand: npm run start:prod
    # Render polls this path every ~30s. If it returns non-2xx, Render
    # restarts the instance — so the endpoint must verify the things
    # whose failure means "this container can't serve traffic":
    #   • dist/index.html exists (frontend deployable)
    #   • heap is below 90% of cap (won't OOM mid-request)
    #   • DB is reachable
    healthCheckPath: /api/health
    # Skip rebuilds when only docs/markdown change — saves ~3min per cosmetic commit.
    buildFilter:
      paths:
        - "src/**"
        - "public/**"
        - "*.js"
        - "*.cjs"
        - "*.mjs"
        - "*.json"
        - "*.html"
        - "*.css"
        - "scripts/**"
        - "legal/**"
        - "render.yaml"
        - "vite.config.js"
        - "tailwind.config.js"
        - "postcss.config.js"
      ignoredPaths:
        - "**/*.md"
        - "docs/**"
        - ".env.example"
        - ".gitignore"
        - "DEPLOYMENT.md"
        - "INSTRUCTIONS.md"
    disk:
      name: bundly-data
      mountPath: /var/data
      sizeGB: 5              # 1GB barely fits product-db images; 5GB gives headroom.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000          # Render's default. Internal only — public goes through 443.
      - key: DATA_DIR
        value: /var/data
      # NODE_OPTIONS IS DELIBERATELY NOT SET HERE ANY MORE.
      #
      # It used to carry --max-old-space-size=1700, and the reasoning was sound:
      # V8's default lets the process run past the container ceiling and get
      # SIGKILLed mid-request instead of GCing first. The problem was that it
      # never took effect. The live service reported a 1,048 MB cap — V8's own
      # default — because the running service was not created from this
      # blueprint and never picked the variable up. A number that only exists in
      # a file nobody applied is documentation, not configuration.
      #
      # scripts/start-prod.mjs now computes the cap at boot from the cgroup
      # limit (the number the kernel actually enforces; os.totalmem() reports
      # the host inside a container and would overshoot). It takes 80%, so the
      # 2 GB standard plan gets ~1,638 MB, and it stays correct if the plan is
      # resized without anyone remembering to edit this file.
      #
      # Setting NODE_OPTIONS here or in the dashboard still wins — the launcher
      # checks for it first and steps aside. Do that only to override
      # deliberately.
      # Generate strong secrets once on first deploy:
      - key: JWT_SECRET
        generateValue: true
      - key: URL_SIGN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # ── These must be set MANUALLY in Render dashboard (sync: false hides
      #     them from blueprint sync so they aren't accidentally overwritten). ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # TWILIO_SID can be an "AC..." Account SID (with TWILIO_TOKEN = Auth
      # Token) OR an "SK..." API Key SID (with TWILIO_TOKEN = API Key Secret
      # AND TWILIO_ACCOUNT_SID = the parent AC... ID). API Keys are the
      # recommended posture, they can be revoked without rotating the
      # account-wide auth token.
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: HCAPTCHA_SECRET
        sync: false
      # Single source of admin identity for the OTP-based admin login at
      # /api/auth/verify-otp. Any Israeli phone format works (normalised
      # server-side). Leave unset to disable OTP-based admin login.
      - key: BUNDLY_ADMIN_PHONE
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://bundly.co,https://www.bundly.co
      - key: BUNDLY_SUPPORT_EMAIL
        value: bundly.co@bundly.co
