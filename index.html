<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes" />
    <!-- Use the new standard `mobile-web-app-capable` (W3C); keep the
         `apple-` variant as a fallback for older iOS versions still parsing it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="format-detection" content="telephone=no" />
    <title>Bundly — בנדלי | קנייה קבוצתית, מחירים נמוכים יותר</title>
    <meta name="description" content="בנדלי — פלטפורמת קנייה קבוצתית בישראל. מצרפים קונים, מקבלים הנחות אמיתיות מהיבואנים והספקים. מקררים, טלוויזיות, סמארטפונים, מוצרי חשמל ועוד — במחירי קבוצה." />
    <meta name="keywords" content="בנדלי, Bundly, קנייה קבוצתית, מחירי קבוצה, הנחות, מקרר, טלוויזיה, סמארטפון, אייפון, גלקסי, מוצרי חשמל" />
    <meta name="author" content="Bundly" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.bundly.co/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bundly.co/" />
    <meta property="og:title" content="Bundly — בנדלי | קנייה קבוצתית בישראל" />
    <meta property="og:description" content="מצטרפים לקבוצות, חוסכים יחד. הנחות אמיתיות ישירות מהיבואנים על מוצרי חשמל וטכנולוגיה." />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="Bundly" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bundly — בנדלי | קנייה קבוצתית" />
    <meta name="twitter:description" content="מצטרפים לקבוצות, חוסכים יחד." />

    <!-- Image used by Google rich-result, Facebook, WhatsApp, LinkedIn,
         Twitter/X cards. 1200×630 is the Open Graph recommended size. -->
    <meta property="og:image"        content="https://www.bundly.co/og-image.svg" />
    <meta property="og:image:type"   content="image/svg+xml" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Bundly — Group buying in Israel, real group prices" />
    <meta name="twitter:image"       content="https://www.bundly.co/og-image.svg" />
    <meta name="twitter:image:alt"   content="Bundly — Group buying in Israel" />

    <!-- Structured data (JSON-LD) for Google rich results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Bundly",
        "alternateName": "בנדלי",
        "url": "https://www.bundly.co",
        "logo": "https://www.bundly.co/og-image.svg",
        "image": "https://www.bundly.co/og-image.svg",
        "description": "פלטפורמת קנייה קבוצתית בישראל — מצרפים קונים ומקבלים הנחות.",
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Bundly",
        "url": "https://www.bundly.co",
        "image": "https://www.bundly.co/og-image.svg",
        "inLanguage": "he-IL",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.bundly.co/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>" />
    <!-- Rubik — clean geometric, excellent Hebrew support -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Stripe.js preconnect — speeds up the credit-card iframe load by ~300ms -->
    <link rel="preconnect" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://api.stripe.com" />
    <!-- OpenAI API preconnect (chat / image enrichment) -->
    <link rel="dns-prefetch" href="https://api.openai.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Rubik', sans-serif; }
      .font-hero { font-family: 'Rubik', sans-serif; letter-spacing: -0.02em; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
